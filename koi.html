<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Koi — Liquid Light</title>
<!--
  KOI POND — LIQUID LIGHT
  You never see the fish. A small school of koi swims beneath a full-screen pond
  rendered entirely in ASCII — boids with bow waves and tail flicks pressed into
  a ripple simulation, so the only thing drawn is the water remembering where
  they swam: wakes, feeding rings, the rare breach. Your cursor is food — move
  and they follow; click to toss a pellet (close fish startle first, then circle
  in). One density ramp (@#%&*?!<>=+/:-· ) shades the lit surface; the dark ink
  never appears, because the koi are never rendered.
  Dark ink on cream · D inverts (or open with #dark). Fully responsive.
-->
<style>
  :root{ --light:245,245,240; --dark:24,24,24; --bg:rgb(var(--light)); --fg:rgb(var(--dark)); }
  html.dark{ --bg:rgb(var(--dark)); --fg:rgb(var(--light)); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:var(--bg); overflow:hidden; }
  body{ color:var(--fg); cursor:crosshair;
    font-family: ui-monospace,"SF Mono","Menlo","Cascadia Mono","DejaVu Sans Mono",monospace;
    transition: background .7s ease, color .7s ease; -webkit-font-smoothing:antialiased; }
  #pool{ position:fixed; inset:0; white-space:pre; font-weight:500; overflow:hidden;
    user-select:none; -webkit-user-select:none; animation: rise 1.8s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise{ from{ opacity:0; filter:blur(5px); } to{ opacity:1; filter:none; } }
  #hud{ position:fixed; left:0; bottom:0; padding:11px 13px; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; opacity:.34; pointer-events:none; user-select:none; mix-blend-mode:difference; color:#999; }
  @media (prefers-reduced-motion: reduce){ #pool{ animation:none; } }
</style>
</head>
<body>
  <pre id="pool" aria-hidden="true"></pre>
  <div id="hud">koi pond · the water remembers · move — they follow · click — they feed · d to invert</div>
<script>
(() => {
  "use strict";
  const RAMP = "@#%&*?!<>=+/:-· ", L = RAMP.length;    // one ramp — the dark ink is reserved for the koi, who are never drawn
  const pool = document.getElementById("pool");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (location.hash.indexOf("dark") >= 0) document.documentElement.classList.add("dark");

  // ---- responsive grid ------------------------------------------------------
  let GW=0, GH=0, cw=6, ch=12, AR=2, sx=1, originX=0, originY=0;
  let hgt, cur, prv, Xc, Yr, wXc, wYc, wXr, wYr;
  let koi = null;
  function fit(){
    cw = Math.max(5, Math.min(9, Math.round(innerWidth / 238)));   // small glyphs, finer detail
    ch = Math.round(cw * 1.95);  AR = ch / cw;
    GW = Math.max(40, Math.floor(innerWidth / cw));
    GH = Math.max(24, Math.floor(innerHeight / ch));
    pool.style.fontSize = (cw / 0.6).toFixed(2) + "px";
    pool.style.lineHeight = ch + "px";
    sx = 230 / GW;                                                  // keep the wave scale resolution-independent
    const N = GW*GH;
    hgt = new Float32Array(N); cur = new Float32Array(N); prv = new Float32Array(N);
    Xc = new Float32Array(GW); Yr = new Float32Array(GH);
    wXc = new Float32Array(GW); wYc = new Float32Array(GW); wXr = new Float32Array(GH); wYr = new Float32Array(GH);
    for (let i=0;i<GW;i++) Xc[i] = i*sx;
    for (let j=0;j<GH;j++) Yr[j] = j*AR*sx;
    const r = pool.getBoundingClientRect(); originX = r.left; originY = r.top;
    if (!koi) school(); else for (const f of koi){                  // keep the school across resizes
      if (f.u>GW-2) f.u=GW-2; if (f.v>GH*AR-2) f.v=GH*AR-2; }
  }

  // ---- the school (you will never see them) ----------------------------------
  // fish live in square units: u in cells, v in cell-widths (row = v / AR)
  function school(){
    const n = Math.max(6, Math.min(16, Math.round(GW*GH/1900)));
    koi = [];
    for (let i=0;i<n;i++) koi.push({
      u: 4+Math.random()*(GW-8), v: 4+Math.random()*(GH*AR-8),
      h: Math.random()*6.283, spd: 0,
      cs: 5.5+Math.random()*2.5,                      // cruise, units/s
      sz: 0.8+Math.random()*0.6,                      // how hard it presses the water
      len: 3.6+Math.random()*1.6,                     // nose to tail
      ph: Math.random()*6.283, wt: 0,                 // tail phase, wander angle
      wf: 0.5+Math.random()*0.6, wp: Math.random()*6.283,
      dart: 0, nibAt: 0
    });
  }

  // ---- pressing the water (the only brush there is) ---------------------------
  function poke(ci, cj, s, rad){
    for (let dj=-rad; dj<=rad; dj++) for (let di=-rad; di<=rad; di++){
      const ii=ci+di, jj=cj+dj; if(ii<1||ii>=GW-1||jj<1||jj>=GH-1)continue;
      const d=Math.hypot(di,dj); if(d>rad)continue; cur[jj*GW+ii] -= s*(1-d/rad);
    }
  }
  function stepRipple(){
    for (let j=1;j<GH-1;j++){ const r=j*GW;
      for (let i=1;i<GW-1;i++){ const k=r+i; let v=(cur[k-1]+cur[k+1]+cur[k-GW]+cur[k+GW])*0.5 - prv[k]; v*=0.946; prv[k]=v; } }
    const tmp=cur; cur=prv; prv=tmp;                  // long memory — the pond remembers
  }

  // ---- food + startle ---------------------------------------------------------
  const food = { u:0, v:0, until:-1 };
  addEventListener("pointermove", e=>{
    food.u=(e.clientX-originX)/cw; food.v=(e.clientY-originY)/cw;
    food.until = performance.now()+1600;
  });
  addEventListener("pointerdown", e=>{
    const u=(e.clientX-originX)/cw, v=(e.clientY-originY)/cw;
    food.u=u; food.v=v; food.until = performance.now()+7000;        // a pellet floats a while
    poke(u|0, (v/AR)|0, 8, 5);                                      // the pellet hits the water
    for (const f of koi){ const du=f.u-u, dv=f.v-v, d=Math.hypot(du,dv);
      if (d<12){ f.h=Math.atan2(dv,du||0.01); f.dart=16; } }        // close fish startle away…
  });
  addEventListener("keydown", e=>{ if(e.key.toLowerCase()==="d") document.documentElement.classList.toggle("dark"); });

  // ---- the swim: separation · alignment · cohesion · wander · walls · food ----
  let breachAt = 12+Math.random()*15;
  function fishStep(dt, sec, nowMs){
    const W=GW, Hv=GH*AR, fed = food.until>nowMs;
    for (let a=0;a<koi.length;a++){
      const f=koi[a];
      let sxv=0, syv=0, cu=0, cv=0, cn=0, au=0, av=0;
      for (let b=0;b<koi.length;b++){ if(b===a)continue; const g=koi[b];
        const du=g.u-f.u, dv=g.v-f.v, d2=du*du+dv*dv;
        if (d2<36){ const d=Math.sqrt(d2)||1; const w=2.2*(1-d/6)/d; sxv-=du*w; syv-=dv*w; }
        else if (d2<400){ cu+=g.u; cv+=g.v; cn++; au+=Math.cos(g.h); av+=Math.sin(g.h); } }
      if (cn){ const iu=cu/cn-f.u, iv=cv/cn-f.v, il=Math.hypot(iu,iv)||1;
        sxv += iu/il*0.25 + (au/cn)*0.35; syv += iv/il*0.25 + (av/cn)*0.35; }
      f.wt += Math.sin(sec*f.wf+f.wp)*1.6*dt;                       // a slow change of mind
      sxv += Math.cos(f.h+f.wt)*0.4; syv += Math.sin(f.h+f.wt)*0.4;
      const M=9;                                                     // soft banks
      if (f.u<M) sxv += (M-f.u)/M*1.6;  if (f.u>W-M)  sxv -= (f.u-(W-M))/M*1.6;
      if (f.v<M) syv += (M-f.v)/M*1.6;  if (f.v>Hv-M) syv -= (f.v-(Hv-M))/M*1.6;
      let speed=f.cs, feeding=false;
      if (fed){ const du=food.u-f.u, dv=food.v-f.v, d=Math.hypot(du,dv)||1;
        if (d>3.2){ sxv += du/d*1.5; syv += dv/d*1.5; speed=f.cs*1.9; }
        else { feeding=true; speed=2.2; sxv += -dv/d*0.9; syv += du/d*0.9;   // …then circle in and sip
          if (sec>f.nibAt){ f.nibAt=sec+0.3+Math.random()*0.5;
            poke((food.u-1+2*Math.random())|0, ((food.v-1+2*Math.random())/AR)|0, 0.9, 2); } } }
      if (f.dart>0){ speed += f.dart; f.dart -= f.dart*2.2*dt; if(f.dart<0.05)f.dart=0; }
      const tl=Math.hypot(sxv,syv);
      if (tl>0.001){ const ta=Math.atan2(syv,sxv); let dh=ta-f.h;
        while(dh>Math.PI)dh-=6.283; while(dh<-Math.PI)dh+=6.283;
        const wmax=(feeding?2.6:1.7)*dt; f.h += dh>wmax?wmax:(dh<-wmax?-wmax:dh); }
      f.spd += (speed-f.spd)*Math.min(1,3*dt);
      f.u += Math.cos(f.h)*f.spd*dt; f.v += Math.sin(f.h)*f.spd*dt;
      if(f.u<1)f.u=1; else if(f.u>W-2)f.u=W-2;
      if(f.v<1)f.v=1; else if(f.v>Hv-2)f.v=Hv-2;
      f.ph += (1.4+f.spd*0.55)*3.1416*dt;                           // tail beats with effort
      // the wake — bow bulge, body displacement, a flick shed off the tail; splashier when darting
      const k60=dt*60, press=f.sz*(1+f.dart*0.12), hu=Math.cos(f.h), hv=Math.sin(f.h);
      poke(f.u|0, (f.v/AR)|0, -0.26*press*k60, 2);
      poke((f.u-hu*f.len*0.5)|0, ((f.v-hv*f.len*0.5)/AR)|0, -0.12*press*k60, 2);
      const sw=Math.sin(f.ph), px=-hv*1.3*sw, py=hu*1.3*sw;
      const tu=f.u-hu*f.len+px, tv=f.v-hv*f.len+py;
      poke(tu|0, (tv/AR)|0, 0.20*press*k60*sw, 2);
    }
    if (sec>breachAt && koi.length){                                // rarely, one of them touches the sky
      const f=koi[(Math.random()*koi.length)|0];
      poke(f.u|0, (f.v/AR)|0, 11, 6); f.dart=18; f.h+=(-0.5+Math.random())*2;
      breachAt = sec+16+Math.random()*22;
    }
  }

  // ---- light + constants (proven offline) -----------------------------------
  const NS=4.2, RIP=1.05, AMB=0.55;                   // wakes carry the image; the open water stays soft
  let lx=-0.40, ly=-0.52, lz=0.76; { const ll=1/Math.hypot(lx,ly,lz); lx*=ll; ly*=ll; lz*=ll; }
  let hx=lx, hy=ly, hz=lz+1; { const hl=1/Math.hypot(hx,hy,hz); hx*=hl; hy*=hl; hz*=hl; }

  function loop(now){
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now-(loop.last===undefined?now:loop.last))*0.001); loop.last=now;
    const sec = now*0.001;
    const t = (reduced ? now*0.4 : now) * 0.00098;

    stepRipple();
    fishStep(reduced?dt*0.5:dt, sec, performance.now());

    // separable domain warp (per row / per col) → organic drift, cheap
    const br = 1 + 0.20*Math.sin(t*0.061);
    for (let i=0;i<GW;i++){ const x=Xc[i];
      wXc[i]=br*(5.4*Math.cos(x*0.0080 - t*0.10) + 1.8*Math.cos(x*0.0210 + t*0.072));
      wYc[i]=br*(7.2*Math.cos(x*0.0100 - t*0.13) + 1.6*Math.sin(x*0.0170 - t*0.052)); }
    for (let j=0;j<GH;j++){ const y=Yr[j];
      wXr[j]=br*(7.2*Math.sin(y*0.0120 + t*0.16) + 1.6*Math.cos(y*0.0240 - t*0.058));
      wYr[j]=br*(5.4*Math.sin(y*0.0090 + t*0.11) + 1.8*Math.sin(y*0.0190 + t*0.082)); }

    // height field: a softened open-water swell + everything the koi have done to it
    const t05=t*0.50, t42=t*0.42, t70=t*0.70, t95=t*0.95, t128=t*1.28;
    for (let j=0;j<GH;j++){ const row=j*GW, y=Yr[j], wxr=wXr[j], wyr=wYr[j];
      for (let i=0;i<GW;i++){ const k=row+i;
        const wx = Xc[i] + wXc[i] + wxr, wy = y + wYc[i] + wyr;
        const h = 0.820*Math.sin(wx*0.020 + wy*0.010 - t05)
                + 0.372*Math.sin(-wx*0.013 + wy*0.026 + t42)
                + 0.236*Math.sin(wx*0.040 - wy*0.030 - t70)
                + 0.124*Math.sin(wx*0.070 + wy*0.055 + t95)
                + 0.058*Math.sin(wx*0.118 - wy*0.094 - t128);
        hgt[k] = h*AMB + cur[k]*RIP;
      }
    }

    // shade: height tone + diffuse + specular glint + fresnel → glyph
    const lines = new Array(GH);
    for (let j=0;j<GH;j++){ const row=j*GW, up=(j>0?-GW:0), dn=(j<GH-1?GW:0);
      let line="";
      for (let i=0;i<GW;i++){ const k=row+i, le=(i>0?1:0), re=(i<GW-1?1:0);
        let nx=(hgt[k-le]-hgt[k+re])*(0.5*NS), ny=(hgt[k+up]-hgt[k+dn])*(0.5*NS);
        const inv=1/Math.sqrt(nx*nx+ny*ny+1); nx*=inv; ny*=inv; const nz=inv;
        const diff = nx*lx+ny*ly+nz*lz;
        let sp = nx*hx+ny*hy+nz*hz; if(sp<0)sp=0; sp*=sp; sp*=sp; sp*=sp; sp*=sp; sp*=sp;   // sp^32, sharp glint
        let lum = 0.84 + 0.30*(hgt[k]/1.2) + 0.08*(diff-0.5) + 0.74*sp;
        if (lum<0.42) lum=0.42; else if (lum>1) lum=1;  // wake troughs dig a little deeper — but never to ink
        let g=(lum*(L-1)+0.5)|0; if(g<0)g=0; else if(g>L-1)g=L-1;
        line += RAMP[g];
      }
      lines[j]=line;
    }
    pool.textContent = lines.join("\n");
  }

  fit(); addEventListener("resize", fit);
  for (let s=0;s<150;s++){ stepRipple(); fishStep(1/60, s/60, 0); }  // the pond was here before you arrived
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
